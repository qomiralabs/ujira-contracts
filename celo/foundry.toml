[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Exact compiler, never resolved from pragmas, so every build uses the same bytecode.
# 0.8.37 is the newest release and has one known low severity bug, against eight in
# 0.8.30. Bump only after the next release has been out a while with a clean bug list.
solc = "0.8.37"
auto_detect_solc = false

# Celo mainnet and Celo Sepolia both run Prague. Osaka is not live there, and solc
# 0.8.31 and later default to it, so removing this pin can emit opcodes Celo rejects.
evm_version = "prague"

optimizer = true
# 200 runs balances deploy and call cost; fewer runs saves almost no bytecode.
optimizer_runs = 200
# The legacy pipeline keeps the mandate under its size budget, and the IR pipeline
# carries most of the recent serious compiler bugs.
via_ir = false
# Celo allows 64 KiB of runtime code, so tests and scripts deploy under the chain's
# real limit. scripts/check-sizes.sh enforces our own tighter budgets.
code_size_limit = 65536
# Keep the default ipfs metadata hash in the bytecode. Without it Sourcify and the
# explorers can only give a partial match, and we want proof of the exact source.
bytecode_hash = "ipfs"
cbor_metadata = true

# A compiler warning is a build failure. Vendored code is not ours to fix.
deny = "warnings"
ignored_warnings_from = ["lib"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"
sort_imports = true
wrap_comments = false

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Exact compiler, never resolved from pragmas, so every build uses the same bytecode.
solc = "0.8.30"
auto_detect_solc = false

# Cancun is the newest fork every Celo network we target runs. Raise it only
# after checking the fork schedule for mainnet and testnet.
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true

# A compiler warning is a build failure. Vendored code is not ours to fix.
deny = "warnings"
ignored_warnings_from = ["lib"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"
sort_imports = true
wrap_comments = false

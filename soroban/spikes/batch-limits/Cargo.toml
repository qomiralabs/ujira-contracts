[package]
name = "batch-limits-spike"
version = "0.0.0"
description = "Measures batch request and execute resource use of the prototype wasm against the network limits."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "=2.2.0"
serde_json = "=1.0.154"
sha2 = "=0.10.9"

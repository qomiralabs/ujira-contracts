[workspace]
resolver = "2"
members = [
    "contracts/placeholder",
    "spikes/batch-limits",
    "spikes/batch-limits/proto",
    "spikes/soroban-edges",
    "spikes/soroban-edges/child",
]
# Only production contracts build by default. The spikes are measurement code,
# one of them a deliberately hostile token, and must never land in a release
# folder by accident. CI lints and tests them with --workspace.
default-members = ["contracts/placeholder"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
soroban-sdk = "=29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
resolver = "2"
members = [
    "contracts/mandate",
    "contracts/placeholder",
    "crates/mandate-config",
    "crates/mandate-errors",
    "spikes/attestation-parity",
    "spikes/batch-limits",
    "spikes/batch-limits/proto",
    "spikes/soroban-edges",
    "spikes/soroban-edges/child",
    "vector-runner",
    "vector-runner/contracts/reference-factory",
    "vector-runner/contracts/reference-mandate",
    "vector-runner/contracts/test-token",
]
# Only production contracts build by default. The spikes are measurement code,
# one of them a deliberately hostile token, and must never land in a release
# folder by accident. CI lints and tests them with --workspace.
default-members = ["contracts/mandate", "contracts/placeholder"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
soroban-sdk = "=29.0.1"
mandate-errors = { path = "crates/mandate-errors" }
mandate-config = { path = "crates/mandate-config" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

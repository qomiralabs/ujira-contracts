name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs for pushes to
# development, staging and main are never cancelled, so every merged commit
# keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every tool is a pinned release binary checked against its SHA256 before it
# runs. Bump a version and its hash together.
env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  STELLAR_CLI_VERSION: 28.1.0
  STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  NODE_VERSION: 24.21.0
  # gitleaks is MIT licensed. Bump the version and its hash together, and
  # only to a release at least 14 days old.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Scans the whole history, not only the change, so it checks out every
  # commit. A key that was committed and later deleted, or added in a merge
  # resolution, still fails.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tarball="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm "$tarball"
          version=$("${RUNNER_TEMP}/gitleaks/gitleaks" version)
          [ "$version" = "${GITLEAKS_VERSION}" ] || { echo "gitleaks is $version, not ${GITLEAKS_VERSION}" >&2; exit 1; }
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      # On pull requests the rules come from the base branch, so a change
      # cannot loosen the rules its own scan runs with. Empty on pushes.
      - name: Scan the full history for secrets
        env:
          SECRET_SCAN_BASE_REF: ${{ github.base_ref }}
        run: scripts/secret-scan.sh

      # Plants generated fake keys in throwaway repos and checks the scan
      # fails on each, so a config change cannot quietly stop detection.
      - name: Test the secret scan
        if: ${{ !cancelled() }}
        run: scripts/secret-scan.test.sh

  headers:
    name: headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}" actionlint
          rm actionlint.tar.gz
          "${RUNNER_TEMP}/actionlint" -color

      - name: Check license headers
        run: scripts/check-headers.sh

      - name: Test the header check
        run: scripts/check-headers.test.sh

      # Literal bidirectional controls and invisible characters can make code
      # read differently from how it runs. Uses the runner's python3 and its
      # standard library only.
      - name: Check invisible characters
        run: scripts/check-invisible-characters.py

      - name: Test the invisible character check
        run: scripts/check-invisible-characters.test.sh

      # The template every pull request starts from must keep asking for the
      # linked issue, tests, docs, the checklist and the required reviews.
      - name: Check the pull request template
        run: |
          scripts/check-pr-template.sh
          scripts/check-pr-template.test.sh

      # Every rule in the mandate spec has a unique, indexed ID, and every
      # numbered check in an operation's check order cites exactly one rule.
      # Every file git tracks under spec/ is a regular file with an ASCII
      # path and holds printable ASCII and LF only, plus a documented
      # allowlist; that part uses git and the runner's python3 standard
      # library.
      - name: Check the mandate spec rule IDs
        run: scripts/check-spec-ids.sh --check-order

      - name: Test the spec ID check
        run: scripts/check-spec-ids.test.sh

      # The worked attestation example in spec/ENCODING.md is recomputed from its
      # inputs, and the address bytes match the ones the Stellar SDK produced.
      - name: Test the attestation message example
        run: scripts/attestation-message.test.sh

  # The attestation parity fixture is generated, and the Soroban suite trusts
  # it. Rebuilding it from the reference signer must give the committed bytes,
  # so a hand edit or a signer change cannot drift from what the suite runs.
  fixtures:
    name: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: spikes/attestation-parity/generator
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installs exactly the lockfile, and no package gets to run install
      # scripts.
      - name: Install the generator
        run: |
          node --version | grep -qx "v${NODE_VERSION}" || { echo "node is not ${NODE_VERSION}" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the attestation fixture
        run: node generate.mjs --check ../fixture.json

  soroban:
    name: soroban
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Incremental output is never reused in CI and only bloats the cache.
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: soroban
        # rust-toolchain.toml is the only toolchain source: an inherited
        # RUSTUP_TOOLCHAIN would silently win over it, so every step drops it.
        shell: env -u RUSTUP_TOOLCHAIN bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "no channel in rust-toolchain.toml" >&2
            exit 1
          fi
          rustup --version
          # Installs exactly what rust-toolchain.toml lists, target and
          # components included.
          rustup toolchain install
          active=$(rustup show active-toolchain)
          echo "$active"
          case "$active" in
            "${channel}-"*"(overridden by "*"rust-toolchain.toml"*) ;;
            *) echo "active toolchain is not the rust-toolchain.toml pin ${channel}" >&2; exit 1 ;;
          esac
          rustc --version | grep -q "^rustc ${channel} " || { echo "rustc is not ${channel}" >&2; exit 1; }
          cargo --version | grep -q "^cargo ${channel} " || { echo "cargo is not ${channel}" >&2; exit 1; }
          rustup target list --installed | grep -qx wasm32v1-none || { echo "wasm32v1-none is not installed" >&2; exit 1; }
          echo "toolchain=${channel}" >> "$GITHUB_ENV"

      # Keyed on the toolchain and the lockfile. A lockfile change restores
      # the closest older cache and only rebuilds what changed.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            soroban/target
          key: soroban-${{ runner.os }}-${{ env.toolchain }}-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            soroban-${{ runner.os }}-${{ env.toolchain }}-

      - name: Install stellar-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo stellar.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar.tar.gz" | sha256sum --check --strict
          tar -xzf stellar.tar.gz -C "${RUNNER_TEMP}/bin" stellar
          rm stellar.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/stellar" --version
          "${RUNNER_TEMP}/bin/stellar" --version | head -n 1 | grep -q "^stellar ${STELLAR_CLI_VERSION} " \
            || { echo "stellar is not ${STELLAR_CLI_VERSION}" >&2; exit 1; }

      - name: Install cargo-deny
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf cargo-deny.tar.gz -C "${RUNNER_TEMP}/bin" --strip-components=1 "${name}/cargo-deny"
          rm cargo-deny.tar.gz
          "${RUNNER_TEMP}/bin/cargo-deny" --version | grep -qx "cargo-deny ${CARGO_DENY_VERSION}" \
            || { echo "cargo-deny is not ${CARGO_DENY_VERSION}" >&2; exit 1; }

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Advisories, licenses and crate sources, against the committed lockfile
      # and soroban/deny.toml.
      - name: cargo deny
        run: cargo deny --locked check advisories licenses sources

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      # Soroban rewrites test_snapshots/ when a test's output changes, so a
      # changed or new snapshot must fail here rather than pass unnoticed.
      - name: Check test snapshots are unchanged
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff
            echo "the tests changed tracked files or wrote new ones, commit the updated snapshots" >&2
            exit 1
          fi

      - name: Test the build script
        run: ../scripts/soroban-build.test.sh

      # Production contracts only: each cdylib crate under contracts/ is built
      # with its own --package, and the release folder must then hold exactly
      # their wasm, so a spike crate can never end up next to them.
      - name: stellar contract build
        run: |
          ../scripts/soroban-build.sh
          ls -l target/wasm32v1-none/release/*.wasm

      - name: Check the tree is clean after the build
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "the build changed tracked files or wrote files outside target/" >&2
            exit 1
          fi

      - name: Test the wasm fixture check
        run: ../scripts/check-wasm-fixtures.test.sh

      # Spike tests load committed wasm because the deployer needs real wasm.
      # Each fixture is rebuilt from its own package and must match byte for
      # byte, so a fixture can never drift from the source it claims to be.
      # It runs after the production build check because these builds also
      # write spike wasm under target/.
      - name: Check wasm fixtures match their source
        run: ../scripts/check-wasm-fixtures.sh

  # Fails on any em dash or en dash in a tracked file's content or its path.
  # The same scripts run in every UJIRA repository. The self test runs first,
  # so the check's result is only trusted once the check is known to fail when
  # it should, and the second step reports even when the first fails.
  dashes:
    name: dashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the dash check
        run: scripts/test-check-dashes.sh

      - name: Check for dashes
        if: ${{ !cancelled() }}
        run: scripts/check-dashes.sh


name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs for pushes to
# development, staging and main are never cancelled, so every merged commit
# keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every tool is a pinned release binary checked against its SHA256 before it
# runs. Bump a version and its hash together.
env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  STELLAR_CLI_VERSION: 28.1.0
  STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  # The x86_64 musl release tarball of rustsec/rustsec tag cargo-audit/v0.22.2.
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
  NODE_VERSION: 24.21.0
  # gitleaks is MIT licensed. Bump the version and its hash together, and
  # only to a release at least 14 days old.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # The Unicode tables of the runner's python3 decide what the invisible character
  # check rejects. A runner update that moves them fails the check, so the set of
  # rejected characters only changes when this does.
  INVISIBLE_UNICODE_VERSION: 15.0.0

jobs:
  # Scans the whole history, not only the change, so it checks out every
  # commit. A key that was committed and later deleted, or added in a merge
  # resolution, still fails.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tarball="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm "$tarball"
          version=$("${RUNNER_TEMP}/gitleaks/gitleaks" version)
          [ "$version" = "${GITLEAKS_VERSION}" ] || { echo "gitleaks is $version, not ${GITLEAKS_VERSION}" >&2; exit 1; }
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      # On pull requests the rules come from the base branch, so a change
      # cannot loosen the rules its own scan runs with. Empty on pushes.
      - name: Scan the full history for secrets
        env:
          SECRET_SCAN_BASE_REF: ${{ github.base_ref }}
        run: scripts/secret-scan.sh

      # Plants generated fake keys in throwaway repos and checks the scan
      # fails on each, so a config change cannot quietly stop detection.
      - name: Test the secret scan
        if: ${{ !cancelled() }}
        run: scripts/secret-scan.test.sh

  headers:
    name: headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}" actionlint
          rm actionlint.tar.gz
          "${RUNNER_TEMP}/actionlint" -color

      - name: Check license headers
        run: scripts/check-headers.sh

      - name: Test the header check
        run: scripts/check-headers.test.sh

      # Literal bidirectional controls and invisible characters can make code
      # read differently from how it runs, in a file, a file name or a symlink
      # target. Reads committed blobs. Uses the runner's python3 and its standard
      # library only, and fails if its Unicode version is not the pinned one.
      - name: Check invisible characters
        run: scripts/check-invisible-characters.py --unicode-version "$INVISIBLE_UNICODE_VERSION"

      - name: Test the invisible character check
        run: scripts/check-invisible-characters.test.sh

      # The template every pull request starts from must keep asking for the
      # linked issue, tests, docs, the checklist and the required reviews.
      - name: Check the pull request template
        run: |
          scripts/check-pr-template.sh
          scripts/check-pr-template.test.sh

      # Every rule in the mandate spec has a unique, indexed ID, and every
      # numbered check in an operation's check order cites exactly one rule.
      # Every file git tracks under spec/ is a regular file with an ASCII
      # path and holds printable ASCII and LF only, plus a documented
      # allowlist; that part uses git and the runner's python3 standard
      # library.
      - name: Check the mandate spec rule IDs
        run: scripts/check-spec-ids.sh --check-order

      - name: Test the spec ID check
        run: scripts/check-spec-ids.test.sh

      # The public test attester keys sign for anyone who rebuilds them from
      # their labels, so they may only appear in test code.
      - name: Check for test attester keys outside tests
        run: |
          scripts/check-test-attesters.py
          scripts/check-test-attesters.test.sh

      # Deployment records are committed, so they may hold public ids only.
      # The self test proves the check refuses secret shaped values, other
      # networks and malformed ids, then checks every deployments/*.json.
      - name: Check the deployment records
        run: scripts/testnet/check-deployment.test.sh

      # The worked attestation example in spec/ENCODING.md is recomputed from its
      # inputs, and the address bytes match the ones the Stellar SDK produced.
      - name: Test the attestation message example
        run: scripts/attestation-message.test.sh

      # Every byte count and length in spec/ENCODING.md is derived from the
      # layout here, not read from the file, and the file is checked against
      # the derivation. The output is kept in the log so the figures can be
      # read against their source without running anything.
      - name: Derive the encoding byte counts
        run: |
          scripts/attestation-message.py --derive
          scripts/attestation-message.py --check-doc spec/ENCODING.md
          scripts/attestation-message.py --check-constants spec/constants.json

  # The shared test vectors must match spec/vectors/schema.json and the spec's
  # rules, errors and events. check-jsonschema and every dependency are pinned
  # with SHA256 hashes in scripts/check-vectors.requirements.txt and installed
  # as wheels only, so nothing is built or run at install time, and the check
  # refuses any other check-jsonschema version. The self test runs first, and
  # the check still reports when it fails.
  vectors:
    name: vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check-jsonschema
        run: |
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/check-jsonschema"
          "${RUNNER_TEMP}/check-jsonschema/bin/pip" install --disable-pip-version-check --no-input \
            --require-hashes --no-deps --only-binary :all: -r scripts/check-vectors.requirements.txt
          echo "CHECK_JSONSCHEMA=${RUNNER_TEMP}/check-jsonschema/bin/check-jsonschema" >> "$GITHUB_ENV"

      - name: Test the vector check
        run: scripts/check-vectors.test.sh

      # Full coverage, so nothing new can land untested: every MANDATE rule
      # keeps a passing and a failing vector, every adjacent pair of checks in
      # every check order keeps a vector proving the earlier check decides the
      # error, and every case of the attestation parity fixture keeps its
      # vector, so a case added to the reference signer cannot go untested.
      - name: Check the vectors
        if: ${{ !cancelled() }}
        run: scripts/check-vectors.sh --require-all --precedence --fixture spikes/attestation-parity/fixture.json

  # The Rust error enum in soroban/crates/mandate-errors must match
  # spec/errors.json entry for entry, so a contract can never return a code
  # the spec gives another meaning. Uses the runner's python3 standard library
  # only. The self test runs first, and the check still reports when it fails;
  # --list keeps every matched code in the log.
  error-codes:
    name: error-codes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the error code check
        run: |
          python3 --version
          scripts/check-error-codes.test.sh

      - name: Check the error codes
        if: ${{ !cancelled() }}
        run: python3 scripts/check-error-codes.py --list

  # The attestation parity fixture is generated, and the Soroban suite trusts
  # it. Rebuilding it from the reference signer must give the committed bytes,
  # so a hand edit or a signer change cannot drift from what the suite runs.
  fixtures:
    name: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: spikes/attestation-parity/generator
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installs exactly the lockfile, and no package gets to run install
      # scripts.
      - name: Install the generator
        run: |
          node --version | grep -qx "v${NODE_VERSION}" || { echo "node is not ${NODE_VERSION}" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the attestation fixture
        run: node generate.mjs --check ../fixture.json

  soroban:
    name: soroban
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Incremental output is never reused in CI and only bloats the cache.
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: soroban
        # rust-toolchain.toml is the only toolchain source: an inherited
        # RUSTUP_TOOLCHAIN would silently win over it, so every step drops it.
        shell: env -u RUSTUP_TOOLCHAIN bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "no channel in rust-toolchain.toml" >&2
            exit 1
          fi
          rustup --version
          # Installs exactly what rust-toolchain.toml lists, target and
          # components included.
          rustup toolchain install
          active=$(rustup show active-toolchain)
          echo "$active"
          case "$active" in
            "${channel}-"*"(overridden by "*"rust-toolchain.toml"*) ;;
            *) echo "active toolchain is not the rust-toolchain.toml pin ${channel}" >&2; exit 1 ;;
          esac
          rustc --version | grep -q "^rustc ${channel} " || { echo "rustc is not ${channel}" >&2; exit 1; }
          cargo --version | grep -q "^cargo ${channel} " || { echo "cargo is not ${channel}" >&2; exit 1; }
          rustup target list --installed | grep -qx wasm32v1-none || { echo "wasm32v1-none is not installed" >&2; exit 1; }
          echo "toolchain=${channel}" >> "$GITHUB_ENV"

      # Keyed on the toolchain and the lockfile. A lockfile change restores
      # the closest older cache and only rebuilds what changed.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            soroban/target
          key: soroban-${{ runner.os }}-${{ env.toolchain }}-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            soroban-${{ runner.os }}-${{ env.toolchain }}-

      - name: Install stellar-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo stellar.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar.tar.gz" | sha256sum --check --strict
          tar -xzf stellar.tar.gz -C "${RUNNER_TEMP}/bin" stellar
          rm stellar.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/stellar" --version
          "${RUNNER_TEMP}/bin/stellar" --version | head -n 1 | grep -q "^stellar ${STELLAR_CLI_VERSION} " \
            || { echo "stellar is not ${STELLAR_CLI_VERSION}" >&2; exit 1; }

      - name: Install cargo-deny
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf cargo-deny.tar.gz -C "${RUNNER_TEMP}/bin" --strip-components=1 "${name}/cargo-deny"
          rm cargo-deny.tar.gz
          "${RUNNER_TEMP}/bin/cargo-deny" --version | grep -qx "cargo-deny ${CARGO_DENY_VERSION}" \
            || { echo "cargo-deny is not ${CARGO_DENY_VERSION}" >&2; exit 1; }

      - name: Install cargo-audit
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          name="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSLo cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${name}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum --check --strict
          tar -xzf cargo-audit.tgz -C "${RUNNER_TEMP}/bin" --strip-components=1 "${name}/cargo-audit"
          rm cargo-audit.tgz
          "${RUNNER_TEMP}/bin/cargo-audit" --version | grep -qx "cargo-audit ${CARGO_AUDIT_VERSION}" \
            || { echo "cargo-audit is not ${CARGO_AUDIT_VERSION}" >&2; exit 1; }

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Advisories, licenses and crate sources, against the committed lockfile
      # and soroban/deny.toml.
      - name: cargo deny
        run: cargo deny --locked check advisories licenses sources

      # A second advisory check with its own database fetch and its own
      # matching, so an advisory cargo deny misses, or a database it cannot
      # fetch, still fails the build. Warnings are denied to match deny.toml,
      # which fails on unmaintained, unsound and yanked crates too.
      #
      # The ignores must be exactly the ones in deny.toml, for the same
      # reasons, and the step fails if the two lists ever differ:
      # - RUSTSEC-2024-0436, paste: unmaintained, not vulnerable. A compile
      #   time proc macro that ark-ff pulls in through soroban-env-host, with
      #   no maintained replacement upstream yet.
      # - RUSTSEC-2026-0387, crypto-bigint 0.5.5: timing variability. It comes
      #   through elliptic-curve 0.13 from soroban-env-host, which soroban-sdk
      #   pulls only with testutils, the native test host, so it has no path
      #   into the wasm32v1-none contract build. The fix needs elliptic-curve
      #   0.14, which no stable soroban-env-host uses yet.
      # Drop both, here and in deny.toml, once soroban-env-host moves past
      # elliptic-curve 0.13 and off paste.
      - name: cargo audit
        run: |
          ignores="RUSTSEC-2024-0436 RUSTSEC-2026-0387"
          want=$(printf '%s\n' $ignores | sort)
          have=$(sed -n 's/^ *{ *id *= *"\(RUSTSEC-[0-9]*-[0-9]*\)".*/\1/p' deny.toml | sort)
          if [ "$want" != "$have" ]; then
            printf 'cargo audit ignores:\n%s\ndeny.toml ignores:\n%s\n' "$want" "$have" >&2
            echo "the cargo audit ignores differ from deny.toml" >&2
            exit 1
          fi
          args=()
          for id in $ignores; do
            args+=(--ignore "$id")
          done
          cargo audit --file Cargo.lock --deny warnings "${args[@]}"

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The mandate's tests load its compiled wasm, never the native
      # contract, so the production contracts are built before the tests. The
      # release step below builds them again from scratch and checks the
      # folder.
      - name: Build the contracts the tests load
        run: ../scripts/soroban-build.sh

      - name: cargo test
        run: cargo test --locked --workspace

      # Soroban rewrites test_snapshots/ when a test's output changes, so a
      # changed or new snapshot must fail here rather than pass unnoticed.
      - name: Check test snapshots are unchanged
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff
            echo "the tests changed tracked files or wrote new ones, commit the updated snapshots" >&2
            exit 1
          fi

      - name: Test the build script
        run: ../scripts/soroban-build.test.sh

      # Production contracts only: each cdylib crate under contracts/ is built
      # with its own --package, and the release folder must then hold exactly
      # their wasm, so a spike crate can never end up next to them.
      - name: stellar contract build
        run: |
          ../scripts/soroban-build.sh
          ls -l target/wasm32v1-none/release/*.wasm

      - name: Check the tree is clean after the build
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "the build changed tracked files or wrote files outside target/" >&2
            exit 1
          fi

      - name: Test the wasm fixture check
        run: ../scripts/check-wasm-fixtures.test.sh

      # Spike tests load committed wasm because the deployer needs real wasm.
      # Each fixture is rebuilt from its own package and must match byte for
      # byte, so a fixture can never drift from the source it claims to be.
      # It runs after the production build check because these builds also
      # write spike wasm under target/.
      - name: Check wasm fixtures match their source
        run: ../scripts/check-wasm-fixtures.sh

  # Holds the worst batches the production contracts accept to the network
  # limits, as compiled wasm. The output names the wasm hashes and the network
  # settings the numbers were compared with.
  batch-limits:
    name: batch-limits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: soroban
        shell: env -u RUSTUP_TOOLCHAIN bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install
          rustc --version | grep -q "^rustc ${channel} " || { echo "rustc is not ${channel}" >&2; exit 1; }
          echo "toolchain=${channel}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            soroban/target
          key: batch-limits-${{ runner.os }}-${{ env.toolchain }}-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            batch-limits-${{ runner.os }}-${{ env.toolchain }}-

      - name: Install stellar-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo stellar.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar.tar.gz" | sha256sum --check --strict
          tar -xzf stellar.tar.gz -C "${RUNNER_TEMP}/bin" stellar
          rm stellar.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build the production contracts
        run: ../scripts/soroban-build.sh

      - name: Run the batch limits suite
        run: cargo test --locked -p batch-limits -- --nocapture --test-threads=1

  # Runs the shared vectors against the compiled factory and mandate with
  # tests/run, and validates the traces against tests/trace.schema.json. The
  # runner's own self tests run in the soroban job with the rest of the
  # workspace. Until soroban/contracts/mandate exists the vectors cannot run,
  # and tests/run says so with exit code 3, which this job accepts only while
  # that directory is missing; once the contract lands, anything but a full
  # pass of the selected vectors fails.
  vectors-stellar:
    name: vectors-stellar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: soroban
        shell: env -u RUSTUP_TOOLCHAIN bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install
          rustc --version | grep -q "^rustc ${channel} " || { echo "rustc is not ${channel}" >&2; exit 1; }
          echo "toolchain=${channel}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            soroban/target
          key: vectors-stellar-${{ runner.os }}-${{ env.toolchain }}-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            vectors-stellar-${{ runner.os }}-${{ env.toolchain }}-

      - name: Install stellar-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo stellar.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar.tar.gz" | sha256sum --check --strict
          tar -xzf stellar.tar.gz -C "${RUNNER_TEMP}/bin" stellar
          rm stellar.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Install check-jsonschema
        run: |
          python3 -m venv "${RUNNER_TEMP}/check-jsonschema"
          "${RUNNER_TEMP}/check-jsonschema/bin/pip" install --disable-pip-version-check --no-input \
            --require-hashes --no-deps --only-binary :all: -r ../scripts/check-vectors.requirements.txt
          echo "CHECK_JSONSCHEMA=${RUNNER_TEMP}/check-jsonschema/bin/check-jsonschema" >> "$GITHUB_ENV"

      - name: Build the production contracts
        run: ../scripts/soroban-build.sh

      # The reference contracts answer these vectors correctly, so this run
      # must pass and its trace proves the trace format end to end.
      - name: Run the runner self test vectors and validate the trace
        run: |
          ../tests/run --chain stellar --files vector-runner/selftest/reference.json \
            --factory-wasm vector-runner/fixtures/vector_runner_reference_factory.wasm \
            --mandate-wasm vector-runner/fixtures/vector_runner_reference_mandate.wasm \
            --trace-out "${RUNNER_TEMP}/reference-trace.json"
          "$CHECK_JSONSCHEMA" --schemafile ../tests/trace.schema.json "${RUNNER_TEMP}/reference-trace.json"

      # Every shared vector, against the mandate with every call in place. A
      # failing vector fails the build. Creation goes through the production
      # factory in soroban/contracts/factory; the reference factory is only a
      # fallback for a tree without it.
      - name: Run the shared vectors
        run: |
          args=(--chain stellar --trace-out "${RUNNER_TEMP}/trace.json")
          if [ ! -d contracts/factory ]; then
            echo "::notice::no production factory yet, creating through the reference factory"
            args+=(--factory-wasm vector-runner/fixtures/vector_runner_reference_factory.wasm)
          fi
          code=0
          ../tests/run "${args[@]}" || code=$?
          "$CHECK_JSONSCHEMA" --schemafile ../tests/trace.schema.json "${RUNNER_TEMP}/trace.json"
          if [ "$code" -eq 3 ] && [ ! -d contracts/mandate ]; then
            echo "::notice::the mandate contract does not exist yet, so the shared vectors are not runnable"
            exit 0
          fi
          exit "$code"

  # The server side of the local guard hooks, which can be skipped or missing on
  # a fresh machine: no dashes in the files a change touches, no attribution in
  # its commit messages, no internal files in the tree. Needs the whole history to
  # find the range. A pull request is checked from its base to its head, and a push
  # from the commit before it, or just its own commit when that one is unknown.
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the hygiene check
        run: |
          shellcheck scripts/hygiene.sh scripts/hygiene.test.sh
          scripts/hygiene.test.sh

      - name: Check hygiene over the range
        if: ${{ !cancelled() }}
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$RANGE_BASE
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${RANGE_HEAD}^"
          fi
          scripts/hygiene.sh "$base" "$RANGE_HEAD"

  # Fails on any em dash or en dash in a tracked file's content or its path.
  # The same scripts run in every UJIRA repository. The self test runs first,
  # so the check's result is only trusted once the check is known to fail when
  # it should, and the second step reports even when the first fails.
  dashes:
    name: dashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the dash check
        run: scripts/test-check-dashes.sh

      - name: Check for dashes
        if: ${{ !cancelled() }}
        run: scripts/check-dashes.sh


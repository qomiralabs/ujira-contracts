name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs for pushes to
# development, staging and main are never cancelled, so every merged commit
# keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every tool is a pinned release binary checked against its SHA256 before it
# runs. Bump a version and its hash together.
env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  STELLAR_CLI_VERSION: 28.1.0
  STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  # Not FOUNDRY_*: forge reads every FOUNDRY_ variable as a config override.
  FORGE_VERSION: 1.5.1
  FORGE_COMMIT: b0a9dd9ceda36f63e2326ce530c10e6916f4b8a2
  FORGE_SHA256: 73640b01bd9ed29fdb4965085099371f8cf0dbbec3e2086cf54564efc4dcfe88
  SLITHER_VERSION: 0.11.6

jobs:
  headers:
    name: headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "${RUNNER_TEMP}" actionlint
          rm actionlint.tar.gz
          "${RUNNER_TEMP}/actionlint" -color

      - name: Check license headers
        run: scripts/check-headers.sh

      - name: Test the header check
        run: scripts/check-headers.test.sh

      # Literal bidirectional controls and invisible characters can make code
      # read differently from how it runs. Uses the runner's python3 and its
      # standard library only.
      - name: Check invisible characters
        run: scripts/check-invisible-characters.py

      - name: Test the invisible character check
        run: scripts/check-invisible-characters.test.sh

  soroban:
    name: soroban
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Incremental output is never reused in CI and only bloats the cache.
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: soroban
        # rust-toolchain.toml is the only toolchain source: an inherited
        # RUSTUP_TOOLCHAIN would silently win over it, so every step drops it.
        shell: env -u RUSTUP_TOOLCHAIN bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "no channel in rust-toolchain.toml" >&2
            exit 1
          fi
          rustup --version
          # Installs exactly what rust-toolchain.toml lists, target and
          # components included.
          rustup toolchain install
          active=$(rustup show active-toolchain)
          echo "$active"
          case "$active" in
            "${channel}-"*"(overridden by "*"rust-toolchain.toml"*) ;;
            *) echo "active toolchain is not the rust-toolchain.toml pin ${channel}" >&2; exit 1 ;;
          esac
          rustc --version | grep -q "^rustc ${channel} " || { echo "rustc is not ${channel}" >&2; exit 1; }
          cargo --version | grep -q "^cargo ${channel} " || { echo "cargo is not ${channel}" >&2; exit 1; }
          rustup target list --installed | grep -qx wasm32v1-none || { echo "wasm32v1-none is not installed" >&2; exit 1; }
          echo "toolchain=${channel}" >> "$GITHUB_ENV"

      # Keyed on the toolchain and the lockfile. A lockfile change restores
      # the closest older cache and only rebuilds what changed.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            soroban/target
          key: soroban-${{ runner.os }}-${{ env.toolchain }}-${{ hashFiles('soroban/Cargo.lock') }}
          restore-keys: |
            soroban-${{ runner.os }}-${{ env.toolchain }}-

      - name: Install stellar-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo stellar.tar.gz "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar.tar.gz" | sha256sum --check --strict
          tar -xzf stellar.tar.gz -C "${RUNNER_TEMP}/bin" stellar
          rm stellar.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/stellar" --version
          "${RUNNER_TEMP}/bin/stellar" --version | head -n 1 | grep -q "^stellar ${STELLAR_CLI_VERSION} " \
            || { echo "stellar is not ${STELLAR_CLI_VERSION}" >&2; exit 1; }

      - name: Install cargo-deny
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf cargo-deny.tar.gz -C "${RUNNER_TEMP}/bin" --strip-components=1 "${name}/cargo-deny"
          rm cargo-deny.tar.gz
          "${RUNNER_TEMP}/bin/cargo-deny" --version | grep -qx "cargo-deny ${CARGO_DENY_VERSION}" \
            || { echo "cargo-deny is not ${CARGO_DENY_VERSION}" >&2; exit 1; }

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Advisories, licenses and crate sources, against the committed lockfile
      # and soroban/deny.toml.
      - name: cargo deny
        run: cargo deny --locked check advisories licenses sources

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      # Soroban rewrites test_snapshots/ when a test's output changes, so a
      # changed or new snapshot must fail here rather than pass unnoticed.
      - name: Check test snapshots are unchanged
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff
            echo "the tests changed tracked files or wrote new ones, commit the updated snapshots" >&2
            exit 1
          fi

      - name: Test the build script
        run: ../scripts/soroban-build.test.sh

      # Production contracts only: each cdylib crate under contracts/ is built
      # with its own --package, and the release folder must then hold exactly
      # their wasm, so a spike crate can never end up next to them.
      - name: stellar contract build
        run: |
          ../scripts/soroban-build.sh
          ls -l target/wasm32v1-none/release/*.wasm

      - name: Check the tree is clean after the build
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "the build changed tracked files or wrote files outside target/" >&2
            exit 1
          fi

      - name: Test the wasm fixture check
        run: ../scripts/check-wasm-fixtures.test.sh

      # Spike tests load committed wasm because the deployer needs real wasm.
      # Each fixture is rebuilt from its own package and must match byte for
      # byte, so a fixture can never drift from the source it claims to be.
      # It runs after the production build check because these builds also
      # write spike wasm under target/.
      - name: Check wasm fixtures match their source
        run: ../scripts/check-wasm-fixtures.sh

  celo:
    name: celo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celo
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo foundry.tar.gz "https://github.com/foundry-rs/foundry/releases/download/v${FORGE_VERSION}/foundry_v${FORGE_VERSION}_linux_amd64.tar.gz"
          echo "${FORGE_SHA256}  foundry.tar.gz" | sha256sum --check --strict
          tar -xzf foundry.tar.gz -C "${RUNNER_TEMP}/bin" forge
          rm foundry.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          version=$("${RUNNER_TEMP}/bin/forge" --version)
          printf '%s\n' "$version"
          # The release build prints its tag after the version, a local
          # foundryup build prints "stable", so the commit is the real check.
          printf '%s\n' "$version" | grep -q "^forge Version: ${FORGE_VERSION}-" \
            || { echo "forge is not ${FORGE_VERSION}" >&2; exit 1; }
          printf '%s\n' "$version" | grep -qx "Commit SHA: ${FORGE_COMMIT}" \
            || { echo "forge was not built from ${FORGE_COMMIT}" >&2; exit 1; }

      # Only the compiler is cached. Build output is rebuilt every run so a
      # stale artifact can never stand in for a deleted contract.
      - name: Cache solc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('celo/foundry.toml') }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: celo/slither-requirements.txt

      # Every package is pinned by hash, so this installs exactly the locked
      # set or fails.
      - name: Install Slither
        run: |
          python -m pip install --require-hashes --no-deps -r slither-requirements.txt
          slither --version | grep -qx "${SLITHER_VERSION}" || { echo "slither is not ${SLITHER_VERSION}" >&2; exit 1; }

      # Every forge call below goes through foundry-env.sh, which drops all
      # FOUNDRY_* and DAPP_* variables in any case, and refuses to run with an
      # unknown profile or with a .env or user-level config forge would read
      # itself. This step also proves forge reads the pinned settings and that
      # no test filter is set.
      - name: Check Foundry config
        run: |
          ../scripts/foundry-env.sh --profile default -- forge config --json >"${RUNNER_TEMP}/config.json"
          jq -e '.solc == "0.8.37" and .evm_version == "prague" and .deny == "warnings" and .auto_detect_solc == false
            and ([.match_test, .no_match_test, .match_contract, .no_match_contract, .match_path, .no_match_path] | all(. == null))' \
            "${RUNNER_TEMP}/config.json"

      - name: forge fmt
        run: ../scripts/foundry-env.sh --profile default -- forge fmt --check

      # foundry.toml sets deny = "warnings", so a compiler warning fails here.
      # --force so nothing compiled earlier in the job is reused.
      - name: forge build
        run: ../scripts/foundry-env.sh --profile default -- forge build --force

      # forge exits 0 when a filter matches no test, so the step also fails
      # unless at least one test actually ran and passed.
      - name: forge test
        run: |
          results="${RUNNER_TEMP}/forge-test.json"
          code=0
          ../scripts/foundry-env.sh --profile default -- forge test --json >"$results" || code=$?
          if ! jq -e 'type == "object"' "$results" >/dev/null 2>&1; then
            cat "$results"
            echo "forge test did not report any test results" >&2
            exit 1
          fi
          jq -r 'to_entries[] | .key as $suite | .value.test_results | to_entries[]
            | "\(.value.status)  \($suite) \(.key)\(if .value.reason then "  " + .value.reason else "" end)"' "$results"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          total=$(jq '[.[].test_results[]] | length' "$results")
          passed=$(jq '[.[].test_results[] | select(.status == "Success")] | length' "$results")
          echo "forge test: ${passed} of ${total} test(s) passed"
          if [ "$total" -eq 0 ] || [ "$passed" -ne "$total" ]; then
            echo "no tests ran, or not every test passed" >&2
            exit 1
          fi

      - name: forge coverage
        run: ../scripts/foundry-env.sh --profile default -- forge coverage --report summary

      - name: slither
        run: ../scripts/foundry-env.sh --profile default -- slither . --config-file slither.config.json --fail-low

      # check-sizes.sh reports how many contracts it checked. That count must
      # match both the contracts it passed and the deployable contracts forge
      # compiled from src/, so a contract dropped from the size report cannot
      # pass unchecked.
      - name: Check contract sizes
        working-directory: .
        run: |
          out=$(scripts/foundry-env.sh --profile default -- scripts/check-sizes.sh)
          printf '%s\n' "$out"
          checked=$(printf '%s\n' "$out" | sed -n 's/^check-sizes: \([0-9][0-9]*\) contract(s) within budget$/\1/p')
          validated=$(printf '%s\n' "$out" | grep -c '^ok: ' || true)
          compiled=$(find celo/out -name '*.json' -not -path 'celo/out/build-info/*' -print0 \
            | xargs -0 jq -r 'select((.metadata.settings.compilationTarget // {} | keys | any(startswith("src/")))
                and ((.deployedBytecode.object // "0x") | length > 2)) | input_filename' \
            | wc -l | tr -d ' ')
          echo "checked=${checked:-none} validated=${validated} compiled=${compiled}"
          if [ -z "$checked" ] || [ "$checked" -eq 0 ] || [ "$checked" -ne "$validated" ] || [ "$checked" -ne "$compiled" ]; then
            echo "check-sizes did not check every contract in celo/src" >&2
            exit 1
          fi

      - name: Test the size check
        working-directory: .
        run: scripts/foundry-env.sh --profile default -- scripts/check-sizes.test.sh

      - name: Test the Foundry environment wrapper
        working-directory: .
        run: scripts/foundry-env.test.sh

      - name: Check the tree is clean
        working-directory: .
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "the gate changed tracked files or wrote untracked ones" >&2
            exit 1
          fi
